[package]
name = "hymeko_wgpu"
version = "0.1.0"
edition = "2024"
description = "WGPU compute backend for the HyMeKo tensor / hypergraph kernels"
license = "MIT OR Apache-2.0"

[lib]
name = "hymeko_wgpu"
crate-type = ["rlib"]

[dependencies]
# Numeric contracts and CSR fixtures are owned by Tensor; no Core/IR dependency.
hymeko_tensor = { workspace = true, features = ["sparse"] }

# Minimal feature set for the target platforms: DX12 and Vulkan on Windows,
# plus the WGSL front-end. GL/WebGPU/WebAssembly are explicitly OFF -- enabling
# them pulls glow, khronos_api, gl_generator, web-sys and the Apple/Android
# stacks into the vendor tree for no benefit here (26 crates, ~32 MiB measured).
[dependencies.wgpu]
version = "30.0.1"
default-features = false
features = ["dx12", "vulkan", "wgsl", "std"]

# Zero-copy &[f32] -> &[u8] for buffer uploads. Already vendored (wgpu-types
# depends on it), so this adds nothing to the dependency tree.
[dependencies.bytemuck]
version = "1"
features = ["derive"]

[dev-dependencies]
# Correctness and opt-in measurement clients of this backend.
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl", "std"] }
bytemuck = "1"
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "spmm_bench"
harness = false

[[bench]]
name = "chain_bench"
harness = false

[[bench]]
name = "arena_bench"
harness = false

[[bench]]
name = "catmull_rom_bench"
harness = false
