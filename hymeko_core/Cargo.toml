[package]
name = "hymeko_core"
version = "0.1.0"
edition = "2024"
autobenches = false
autotests = false

[lib]
name = "hymeko"
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]
#
# Internal dependencies
#
parser = { workspace = true }
hymeko_tensor = { workspace = true }
#
# Common dependencies
#
serde = { workspace = true, features = ["derive"] }
ciborium = "=0.2.2"
crossbeam-queue = "=0.3.14"
rustc-hash = "2.1.1"
blake3 = {  workspace = true }
rayon = { workspace = true }
[dev-dependencies]
hymeko_tensor = { workspace = true, features = ["sparse"] }
log = { workspace = true }
env_logger = { version = "0.11.5", default-features = false, features = ["auto-color"] }
criterion = { version = "0.8.2", default-features = false }
serde_json = "1.0.149"
# The integration tests below reach into the expansion functions
# (moved to `hymeko_hre` on 2026-04-18) and into the hypergraph-aware
# tensor ops + `HyperGraphView` (was hymeko_hnn; relocated to hymeko/nagare 2026-08-31).
# Both are dev-only deps — the hymeko_core library itself depends on
# neither.

[[test]]
name = "mod"
path = "tests/mod.rs"

# Correctness only: isolated from the aggregate's opt-in profile modules.
[[test]]
name = "circular_buffer"
path = "tests/circular_buffer.rs"

[[bench]]
name = "interning_bench"
harness = false

# APPROVED-CORE-EDIT: ir-stream-wire-codec (2026-08-28, Phase 10A brief) — bench
# target for the IR-stream wire validator. Registration is required because
# this crate sets `autobenches = false`. No dependency is added or changed.
[[bench]]
name = "ir_stream_bench"
harness = false

# APPROVED-CORE-EDIT: unified-ir-phase0-audit-only (2026-08-28, Phase 0 brief) —
# bench target declaration only; required because `autobenches = false`.
[[bench]]
name = "ir_bench"
harness = false

# APPROVED-CORE-EDIT: canonical-cbor-codec (2026-09-04) — public-facade encode/decode cells.
[[bench]]
name = "cbor_bench"
harness = false

# Delegated measurement (2026-09-13, user chat): opt-in Core circular buffer benchmark.
# `test = false` keeps ordinary `cargo test` from building it; `main` additionally
# refuses to measure unless Cargo passed `--bench`.
[[bench]]
name = "circular_buffer_bench"
harness = false
test = false
