# Contract gates in CI.
#
# Copy to .github/workflows/duplication-gate.yml to activate. It is kept here
# rather than there deliberately: this repository is LAN-only and has no GitHub
# remote, so a workflow under .github/ would be a file that has never run
# claiming to be a gate. When the contract tooling is adopted in a repository
# that does have Actions, that copy is the activation step.
#
# The duplication check is a DELTA gate. It fails on an increase against
# .duplication-baseline.json and never on an absolute count — an absolute
# ceiling fails on day one in any repository old enough to need one, and a gate
# that fails on day one is switched off on day two.

name: contract gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  symbol-index:
    name: SYMBOLS.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Index is not stale
        run: python3 tools/gen_symbols.py --check

  duplication:
    name: duplication has not increased
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The built-in detector needs nothing installed, so this step is the one
      # that always runs and always means something.
      - name: Delta gate (built-in detector)
        run: python3 tools/duplication_gate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # jscpd is the cross-language detector §6.7 names. It sees renamed-variable
      # copies the line scanner cannot, and it is compared against its OWN
      # baseline entry — the two detectors are not interchangeable, and comparing
      # one against the other's number would be a gate that fires on a tool swap.
      - name: jscpd
        run: |
          npx --yes jscpd@4 . \
            --min-lines 20 --min-tokens 120 \
            --reporters json --output ./.jscpd \
            --ignore "**/target/**,**/node_modules/**,**/*.md,**/pkg/**" \
            --silent || true
      - name: Delta gate (jscpd)
        run: |
          if [ -f .jscpd/jscpd-report.json ]; then
            python3 tools/duplication_gate.py --report .jscpd/jscpd-report.json
          else
            echo "jscpd produced no report — the built-in gate above still ran." >&2
          fi

  language-gates:
    name: per-language duplication and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only where the manifest exists: a repository with no Python package
      # should not fail a Python gate.
      - name: pylint duplicate-code
        run: |
          if ls pyproject.toml setup.py >/dev/null 2>&1; then
            pip install --quiet pylint
            pylint --disable=all --enable=duplicate-code $(git ls-files '*.py') || exit 1
          else
            echo "no Python manifest — skipped"
          fi

      - name: cargo clippy
        run: |
          if [ -n "$(git ls-files '*/Cargo.toml' 'Cargo.toml')" ]; then
            for manifest in $(git ls-files '*/Cargo.toml' 'Cargo.toml'); do
              echo "::group::clippy $manifest"
              cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
              echo "::endgroup::"
            done
          else
            echo "no Cargo manifest — skipped"
          fi
