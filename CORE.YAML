        scope: >
          A byte-identical speed-up of the semantic digest, hymeko_core/src/ir/semantic_digest.rs
          only. Proposed as a per-declaration path cache; the profile then showed that blake3's
          per-update bookkeeping, not path resolution, was the cost (5.2M updates for one
          Bitcoin-OTC graph, 940M of write_target's 1079M instructions), so it is built as
          DigestWriter: the digest's small writes go through a 256-byte stack buffer into one
          blake3 update, with no per-declaration memory. Unit test
          a_buffered_digest_is_the_stream_it_feeds.
        constraints:
          - every digest byte unchanged (blake3 streaming; 105 corpus files compared against 83ef0c1)
