          existing digest benchmark to cover numeric and text updates at scale.
          Numeric and declaration-reference scalar values contain no symbol IDs;
          skip allocating a symbol-walk worklist for those scalar roots.
        constraints:
          - full coherence and model validation remain enabled
          - identical hash bytes, symbols, errors, limits and retained-old-reader behavior
          - no public API, dependency, wire-format or alternate-implementation change
          - targeted correctness and paired before/after latency and memory evidence
          - deliver reports as PDF; notify before any push or merge

      # Explicit user direction, 2026-10-11: remove numbered identity type names.
      - slug: canonical-identity-names
        date: 2026-10-11
        scope: >
          Restore ProgramStructureHash and SemanticModelDigest in their existing
