          declaration_hashes(), path_of() and the crate-private validate(idx);
          CanonicalIdentity is the value a compile keeps (hash(), structure()).
          hymeko_core/src/ir/semantic_digest.rs implements Canon::hash() (the
          semantic V2 digest) and Canon::declaration_hashes() over the Canon's paths.
          They replace canonical_program_hash, program_structure_hash_v1,
          semantic_model_digest_v2 and semantic_declaration_hashes.
          module_store.rs computes CanonicalIdentity once per compile and
          CompiledProgram::canon replaces canon_hash. Call sites migrate in
          writers/cbor_writer.rs and cbor_writer/validate.rs, util/pretty_print.rs,
          module_store/execution_tests.rs and the tests, benches and example;
          ir/hash_pass.rs, ir/coherence.rs and ir/time.rs change documentation only, the
          links that named the replaced functions. build_path_index shares Canon's sorted
          path order (sorted_paths) and no longer clones a path to sort it.
