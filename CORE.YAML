      - slug: dense-base-reuse
        date: 2026-10-20
        authority: user asks to fix the dense-metadata regression overnight
        scope: canonical immutable base-list reuse before payload conversion, wire integration and correctness; user additionally approves dense profiling and five-repeat empty/dense before-after controls on 2026-10-20
        plan: docs/plans/2026-09-07-compiler-repeated-work/plan.pdf
      - slug: compact-storage-control
        date: 2026-10-20
        authority: user approves the proposed matched construction, metadata and update measurements
