          - four recorded regressions and additional discriminating controls
          - full Core and existing Nagare consumer gates before publication

      # APPROVED-CORE-EDIT: executable-model-contract (2026-09-06, user chat)
      - slug: executable-model-contract
        date: 2026-09-06
        scope: >
          Tier 2A/2B of the Nagare Slice-1 enablement, planned in
