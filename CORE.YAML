# CORE.YAML — Core Framework Lockdown Manifest (hymeko/core workspace)
#
# Canonical filename at repository root (CLAUDE.md §0). This file is core:
# edits require approval (see `approval:` below).
#
# Provenance. This workspace was split out of the `hymeko_framework_rust`
# monorepo (see README.md "Provenance / notes"). The monorepo carries its own
# CORE.YAML, but none of the six split-out repositories under
# `hymeko_framework/` (core, graph, network, parser, transformation, hotaru)
# received one — governance stayed behind. Working the 2026-08-24 CPU
# optimisation task surfaced the gap as a §1 / §11 `on_missing_file` halt.
# Created with user approval in that chat turn ("CORE.yaml and tools can be
# created"), scoped to the two crates that actually live here.
#
# Differences from the monorepo manifest, deliberate:
#   * only `hymeko_core` and `hymeko_wgpu` are in scope; crates that never
#     migrated (hymeko_query, hymeko_client, hymeko_daemon, rtl/, docs/spec/)
#     are dropped rather than inherited as dead entries, and `hymeko_hnn` was
#     relocated 2026-08-31 to hymeko/nagare (hymeko_nagare::hnn).
#   * Numeric dependency ownership moved to tensor on 2026-09-23.

schema_version: 1

project:
  name: HyMeKo semantic core
  root_language: rust
  notes: |
    Items listed here are read-only by default. Modifying any of them
    requires explicit user approval BEFORE any code change.
    Workarounds in non-core code are always preferred over a "small"
    core edit. When in doubt: halt and ask.

  # ----------------------------------------------------------------------
  # Lockdown levels (identical semantics to the monorepo manifest)
  # ----------------------------------------------------------------------
  #   full           No edits. Includes comments, whitespace, formatting.
  #
  #   implementation Public API may be extended (additive only).
  #                  Internal logic frozen. Bug-fix patches require
  #                  approval and a regression test.
  #
  #   api            Public API frozen (signatures, types, wire protocol,
  #                  CLI flags). Internal refactors permitted from
  #                  non-core PRs, gated on full integration test pass.
  #
  #   none           Not core. Ordinary review rules apply.
  # ----------------------------------------------------------------------

crates:
  - name: hymeko_core
    path: hymeko_core
    lockdown: full
    reason: >
      Foundational types: IR, interning/resolution, canonical hashing,
      canonical IR-to-tensor adapters. Any change
      propagates to every downstream crate and invalidates published
      benchmarks.
    approved_edits:
