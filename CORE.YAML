      - slug: module-store-borrowed-asts
        date: 2026-09-29
        scope: >
          ModuleStore::compile reads every dependency module's AST in place instead of cloning
          it: the entries and the interner are disjoint fields, so the borrow needs no copy.
          lower_program_to_ir(_with_meta) takes the imports as (SymId, &AstSym); ModuleStore::compile
