          - hash bytes, encoding versions, CBOR and dependencies unchanged
          - Core only; RL and other consumer repositories are outside this task
          - user approved a Core-only commit and push to fix/canonical-identity-names on 2026-10-11
          - no merge or publication of consumer repositories is authorized

      # User chat, 2026-09-23: numeric tensor code belongs in the tensor repository.
      - slug: tensor-numeric-owner-extraction
