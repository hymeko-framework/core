# hymeko/core — standalone workspace: the HyMeKo semantic core.
#   hymeko_core : IR, encoding (writers), tensor primitives
#   hymeko_hnn  : RELOCATED 2026-08-31 to hymeko/nagare as hymeko_nagare::hnn
# `parser` is an external repo (hymeko/parser), pulled as a git dependency.
[workspace]
resolver = "2"
members = ["hymeko_core", "hymeko_wgpu"]

[workspace.dependencies]
serde = "1.0.228"
blake3 = "1.8.3"
rayon = "1.11.0"
arrow = "58.0.0"
iceoryx2 = "0.8.1"
log = "0.4.22"
parser = { git = "https://github.com/hymeko-framework/parser.git", rev = "f11628591a8183586492807ecdf43c64e6d31c5f" }
