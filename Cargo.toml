# hymeko/core — standalone workspace: the HyMeKo semantic core.
#   hymeko_core : IR, encoding (writers), IR-to-tensor adapters
#   hymeko_hnn  : RELOCATED 2026-08-31 to hymeko/nagare as hymeko_nagare::hnn
# `parser` is an external repo (hymeko/parser), pulled as a git dependency.
[workspace]
resolver = "2"
members = ["hymeko_core", "hymeko_wgpu", "dev", "dev/dylib"]
default-members = ["hymeko_core", "hymeko_wgpu"]

# Opt-in native development linkage; ordinary dev/release/bench are unchanged.
[profile.dev-dll]
inherits = "dev"
debug = "line-tables-only"

[workspace.dependencies]
serde = "1.0.228"
blake3 = "1.8.3"
rayon = "1.11.0"
log = "0.4.22"
parser = { git = "ssh://git@192.168.1.228:2222/hymeko/parser.git", rev = "f11628591a8183586492807ecdf43c64e6d31c5f" }
# Virtual-operator provider, published on tensor feat/virtual-operators; ledger in
# docs/hymeko-kernel-ownership.md (tensor extraction, 2026-09-23).
hymeko_tensor = { git = "ssh://git@192.168.1.228:2222/hymeko/tensor.git", rev = "9317ecf773d55a0e7968273a63bc2f4e8dbcc7c7" }
