# hymeko/core — standalone workspace: the HyMeKo semantic core.
#   hymeko_core : IR, encoding (writers), IR-to-tensor adapters
#   hymeko_hnn  : RELOCATED 2026-08-31 to hymeko/nagare as hymeko_nagare::hnn
# `parser` is an external repo (hymeko/parser), pulled as a git dependency.
[workspace]
resolver = "2"
members = ["hymeko_core", "hymeko_wgpu"]

[workspace.dependencies]
serde = "1.0.228"
blake3 = "1.8.3"
rayon = "1.11.0"
log = "0.4.22"
parser = { git = "https://github.com/hymeko-framework/parser.git", rev = "f11628591a8183586492807ecdf43c64e6d31c5f" }
# Public Tensor provider, pinned to the validated release snapshot; ledger in
# docs/hymeko-kernel-ownership.md (tensor extraction, 2026-09-23).
hymeko_tensor = { git = "https://github.com/hymeko-framework/tensor.git", rev = "2d5c64347c4e75c6a520a1d1ee26e0895e127680" }
